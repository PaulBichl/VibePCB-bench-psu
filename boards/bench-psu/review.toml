cite = "LMR33630 SNVSAN3F p.6 Table 7.3 (VIN 3.8-36 V), Table 7.1 (VIN abs max 38 V)"
text = "VIN is 20 V (21 V at PD +5 %), and transients are clamped by D1 SMBJ22A at 35.5 V, under the 38 V absolute maximum."

[[item]]
id = "U11:dropout"
verdict = "ok"
pin = ""
cite = "LMR33630 SNVSAN3F p.8 Table 7.6 (tON_MIN 108 ns max DDA, tON_MAX 9 \u00b5s, tOFF_MIN 85 ns); p.9 (DMAX 98 %); p.17 sec. 8.4.3 (foldback)"
text = "At 16.6 V / 3 A the drops (shunt, 54 m\u03a9 DCR, 160 m\u03a9 HS) require about 17.3 V, a duty of about 91 % at 19 V input, which is within DMAX. At 1.6 V the on-time is about 190 ns at 21 V, above the 108 ns minimum, and lower outputs (CC into a short) use frequency foldback."

[[item]]
id = "U11:output-cap"
verdict = "unknown"
pin = ""
cite = "LMR33630 SNVSAN3F p.20 Table 9-2 (12 V/400 kHz: 4x22 \u00b5F, RFBT 100 k\u03a9); p.22-23 sec. 9.2.2.5 (Bode/transient testing required; max ~10x design or 1000 \u00b5F)"
text = "4x22 \u00b5F 25 V X5R (about 18 \u00b5F at 16 V) plus 100 \u00b5F electrolytic meets Eq. 6 for a 2 A / 400 mV step and stays under the 1000 \u00b5F ceiling. However, the fixed FB gain of 0.625 at every output voltage plus the R111/C113 lag network is outside TI's characterised cases, and the loop decks use unpublished compensation values. Stability needs a Bode or step measurement on the prototype at 1.6 V and 16 V."

[[item]]
id = "U11:input-cap"
verdict = "ok"
pin = "2"
cite = "LMR33630 SNVSAN3F p.23 sec. 9.2.2.6 (\u226510 \u00b5F ceramic rated \u2265 VIN, preferably 2x; plus 220 nF 50 V X7R near the pin)"
text = "C101/C102 are 10 \u00b5F 50 V X5R 1206 (CL31A106KBHNNNE) and C103 is 220 nF 50 V X7R (CC0603KRX7R9BB224). At 20 V bias the two 10 \u00b5F give about 9 \u00b5F, just at the 10 \u00b5F minimum, backed by the shared C6 100 \u00b5F electrolytic and the other VIN ceramics. Placement next to the pins can't be checked here."

[[item]]
id = "U11:output-voltage"
verdict = "ok"
pin = "5"
cite = "LMR33630 SNVSAN3F p.7 Table 7.5 (VFB 0.985-1.015 V); p.6 Table 7.1 (FB abs max 5.5 V)"
text = "VOUT = 1.0 V x (1 + 120k/200k) + 120 k\u03a9 x Isink = 1.6 V at PWM 0 and 16.6 V at Isink = 0.275 V / 2.2 k\u03a9 = 125 \u00b5A (PWM 3.3 V x 10k/120k). VFB tolerance (\u00b11.5 %), op-amp offset and NPN alpha leave about \u00b12 % at the top, which INA226 readback can correct. D16 holds FB below about 4 V."

[[item]]
id = "U11:control-pins"
verdict = "ok"
pin = "3"
cite = "LMR33630 SNVSAN3F p.5 Table 6-1 (EN do not float; PG may be left open); p.7 Table 7.5 (VEN-H 1.26 V max); p.6 (EN \u2264 VIN + 0.3 V)"
text = "EN1 has R109 100 k\u03a9 pull-down and is driven through R110 10 k\u03a9 by the GPIO. The two 47 k\u03a9 base loads leave about 2.35 V, above the 1.26 V threshold, and the INA226 Alert can pull it low. PG is open, which the datasheet allows."

[[item]]
id = "U11:inductor"
verdict = "ok"
pin = "8"
cite = "LMR33630 SNVSAN3F p.21-22 Eq. 4/5, Isat \u2265 ISC; p.7 (ISC 5.05 A max); Changjiang FXL1040 datasheet (15 \u00b5H, 45 m\u03a9, Isat 7 A, Irms 6.5 A)"
text = "Eq. 4 with K = 0.3 at 20 V to 10 V / 3 A gives 13.9 \u00b5H, and Lmin = 0.28 x 16.6 V / 400 kHz = 11.6 \u00b5H, so 15 \u00b5H fits both. The 7 A Isat exceeds the 5.05 A maximum ISC."

[[item]]
id = "U11:thermal"
verdict = "ok"
