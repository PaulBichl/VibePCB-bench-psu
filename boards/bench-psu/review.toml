text = "parts.md lists GND pins 1, 2, 42, 43 and 46-61 only; the four corner GND pads 62-65 are missing from the footprint. Add pads 62-65 per the land pattern (p.45 Fig. 11-1) and tie them to GND for ground return and mechanical anchoring. (cites pin 62, which U5 does not have)"

[[item]]
id = "U11:input-range"
verdict = "ok"
