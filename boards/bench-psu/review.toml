text = "FB gain is fixed at 200k/320k = 0.625 (1.6 V-like loop) at every set point, but 4 x 22 \u00b5F 25 V X5R falls to about 18 \u00b5F at 16 V. Eq.6 for a 2 A step / 400 mV at 1.6 V wants about 150 \u00b5F vs about 70 \u00b5F fitted, and stability rests on the R111/C113 lag network checked only with assumed internal compensation. Fix: add bulk (e.g. 100 \u00b5F 25 V polymer) per output so Cout stays nearly constant, and confirm phase margin on the bench."

