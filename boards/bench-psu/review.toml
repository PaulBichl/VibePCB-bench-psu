[[item]]
id = "board:cap-ratings"
verdict = "ok"
pin = ""
cite = "LCSC: C107083 CC0603KRX7R9BB224 50 V; C21120 CL10B224KA8NNNC 25 V; C45783 CL21A226MAQNNNE 25 V; C53987 0603B472K500NT 50 V; C12891 CL31A226KAHNNNE 25 V; C970686 35 V"
text = "All parts are within 80 % of rating: VIN 21 V on 50 V / 35 V parts, OUT 16.6 V on 25 V (66 %), V5 on 25 V, LAG about 1 V on 25 V. DC-bias loss leaves about 18 uF of output ceramics at 16.6 V and about 9 uF of VIN ceramics per channel, which the sims already assume."

[[item]]
id = "board:resistor-power"
verdict = "ok"
pin = ""
cite = "LCSC C105360 PSA FMF25FPJR020-LH 2512 2 W; ST DS12499 Table 22 p.29 (VBUS discharge 50 mA max, T 756 ms at detach)"
text = "Shunt: 3 A squared x 20 mOhm = 0.18 W in a 2 W part. R121/R221 dissipate 16.6 V squared / 4.7 kOhm = 59 mW in 0603 (0.1 W). R1 (1 kOhm 0603) sees up to 0.4 W only while U1 discharges VBUS from 20 V; the pulse is short because VBUS decays, so it is acceptable."

[[item]]
id = "board:current-path"
verdict = "ok"
pin = ""
cite = "C2765186 3 A; AO4407A 14 A; FXL1040 Irms 6.5 A; DG301 17.5 A"
text = "Each element of the 3 A input path is rated at or above 3 A, and there is no fuse: overcurrent relies on the PD source limit plus firmware power budgeting. Trace widths cannot be checked from these files."

[[item]]
id = "board:intent"
verdict = "ok"
pin = ""
cite = "intent.toml vs. netlist; ST DS12499 Table 6 p.8"
text = "Rails match the intent (V5 5.17 V, V3V3 3.3 V, OUT 1.6-16.6 V), and VBUS_EN_SNK at any contract matches 'a 5 V-only source runs the logic'. The 60 W limit on the sum of both outputs (up to 2 x 50 W) is firmware-only; no hardware measures total input current."

[[item]]
id = "board:sims"
verdict = "issue"
pin = ""
cite = "TI SNVSAN3F p.6 (FB abs max 5.5 V), p.7 (ILIMIT 2.9 A min), p.22-23 (validate loop by Bode/transient)"
text = "powerup_ch.cir only steps the set point up, never down at light load, so it cannot see FB rising to about 10 V (above 5.5 V abs max). buck_loadpoints.cir checks the peak against ISC but not the valley against ILIMIT 2.9 A min. The loop decks use assumed, unpublished gm/Rc/Cc, so their phase margins are indicative only. Fix: add a set-point step-down deck with a measure on max V(fb) and a valley-current check, and confirm the loops on hardware."
