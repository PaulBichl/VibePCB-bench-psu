[[item]]
id = "board:cap-ratings"
verdict = "ok"
pin = ""
cite = "LCSC part data: C13585 10 \u00b5F 50 V 1206, C12891 22 \u00b5F 25 V 1206, C45783 22 \u00b5F 25 V 0805, C15850 10 \u00b5F 25 V 0805, C15849 1 \u00b5F 50 V, C14663 100 nF 50 V, C21120 220 nF 16 V, C970686 100 \u00b5F 35 V"
text = "VIN/VBUS caps are 50 V (C6 35 V electrolytic, 60 %), OUT caps 25 V at 16.6 V (66 %), V5 caps 25 V at 5.17 V, C113/C213 16 V on about 1.3 V, and C19 50 V on 14 V. DC-bias loss on VIN and OUT is covered under U11/U21 input-cap / output-cap."

[[item]]
id = "board:resistor-power"
verdict = "ok"
pin = ""
cite = "R101/R201 2512 20 m\u03a9 (C105360); 0603 thick film 0.1 W; STUSB4500 DS12499 p.29 (TDISUSBPDO 288 ms default)"
text = "Shunt: 9 A\u00b2 x 20 m\u03a9 = 0.18 W in a 2512. R121/R221 dissipate at most 59 mW (59 % of 0.1 W) while discharging or back-fed. R1 1 k\u03a9 sees up to 0.44 W only as short VBUS-discharge pulses, as in ST's reference. LED and divider resistors are under 2 mW."

[[item]]
id = "board:current-path"
verdict = "ok"
pin = ""
cite = "J1 C2765186 3 A; AO4407A p.1-2; LMR33630 SNVSAN3F p.6"
text = "3 A input passes J1 (3 A rated), Q1 (13 m\u03a9) and the VIN plane; there is no fuse/PTC, so overcurrent protection relies on the PD source and the firmware power budget. Each output path (L, 20 m\u03a9 shunt, J2 17.5 A) carries 3 A."

[[item]]
id = "board:intent"
verdict = "issue"
pin = ""
cite = "STUSB4500 DS12499 Rev 3 p.22 Table 18 (default PDO3 20 V / 1.0 A); AP2112 DS39724 p.3 (\u03b8JA 184 \u00b0C/W)"
text = "Two intent assumptions do not hold. (1) \"before the STUSB4500 NVM write only 5 V\": factory NVM negotiates 20 V at 1 A with a 20 V source, so loads must stay under 20 W until programmed. (2) The V3V3 0.4 A budget cannot be met thermally by the AP2112K from 5.17 V (see U4:thermal). Fix: correct the intent and limit load before NVM write; lower V5 or change the 3V3 regulator."

[[item]]
id = "board:sims"
verdict = "issue"
pin = ""
cite = "LMR33630 SNVSAN3F p.7 \u00a77.4 note 2 (R\u03b8JA not for design), p.8 (RDS-ON max 160/110 m\u03a9); sim/powerup_logic.cir header"
text = "powerup_logic.cir models U3 with a \"15 uH SWPA4030\" and 24 \u00b5F on V5, but the board has L1 6.8 \u00b5H FXL0530 and 4 x 22 \u00b5F (C12, C13, C23, C24). buck_loop/cc_loop/powerup_ch rest on assumed, unpublished EA values (gm 1 mS, Rc 12k, Cc 4.7 nF), so their phase margins are not datasheet-backed. buck_loadpoints uses typical Rds x 1.3 and the JEDEC R\u03b8JA, which TI says not to use for design. Fix: align the decks with the BOM, run the thermal corner with max Rds(on), and confirm the loops on the bench."
