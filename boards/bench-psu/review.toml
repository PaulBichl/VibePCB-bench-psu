text = "16.6 V + 3 A x (20 mOhm + 54 mOhm + 160 mOhm) = 17.3 V needs D = 0.91 at 19 V (PD -5 %), below 98 %. At 1.6 V the on time is 200 ns at 400 kHz, above 108 ns."

[[item]]
id = "U11:output-cap"
verdict = "unknown"
pin = ""
cite = ""
text = "4 x 22 uF 25 V X5R 1206 (~18 uF effective at 16.6 V) + 100 uF electrolytic stays under the 1000 uF limit (p.23). But the fixed 1.6 V-style feedback divider is outside Table 9-2 (p.20), and stability rests only on buck_loop.cir with assumed, unpublished internal compensation. TI p.22-23 asks for measured Bode / load-step results; measure at 1.6, 5, 12 and 16.6 V."

[[item]]
id = "U11:input-cap"
verdict = "ok"
