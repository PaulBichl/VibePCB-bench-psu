text = "The U5 footprint ends at pin 61 (GND5-GND20 = pins 46-61), so the datasheet's GND pads 62-65 (the four corner pads) are missing. All listed GND pins are on GND. Use a footprint with all 65 pads and tie 62-65 to GND for mechanical and thermal attachment."

