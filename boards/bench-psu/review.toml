[[item]]
id = "J1:pinout"
verdict = "ok"
pin = ""
cite = "USB Type-C 16P receptacle TYPE-C 16PIN 2MD(073) (LCSC C2765186) pin names; STUSB4500 DS12499 p.25 Fig. 9"
text = "VBUS1/2 = VBUS, GND1/2 = GND, CC1/CC2 go to the STUSB4500 CC pins, Dp1+Dp2 = USB_DP and Dn1+Dn2 = USB_DN (both orientations), SBU left open, shell to USB_SHIELD (1 M\u03a9 || 4.7 nF to GND). The connections match the ST reference. I did not check the pad geometry against the SHOU HAN drawing."

[[item]]
id = "J1:current"
verdict = "ok"
pin = ""
cite = "LCSC C2765186 product page: rated current 5 A"
text = "The intent's maximum is 3 A at 20 V, carried by two VBUS pads and two GND pads, each pad serving the paired A/B contacts. That is under the 5 A rating. The 5 A figure comes from the LCSC page, not from a manufacturer drawing."

[[item]]
id = "J1:protection"
verdict = "ok"
pin = ""
cite = "ESDA25P35-1U1M DocID029556 p.2 Table 2 (VRM 22 V, VCL 41 V); STUSB4500 DS12499 p.25 Fig. 9"
text = "VBUS has D2 (VRM 22 V, above the 21 V PD maximum), CC1/CC2 have U8 ESDA25W, and D+/D- have U2 USBLC6-2SC6, the same protection set as the ST reference. There is no fuse; overcurrent is left to the PD source's own limit, and reverse polarity cannot happen on USB-C."

[[item]]
id = "J1:levels"
verdict = "ok"
pin = ""
cite = "STUSB4500 DS12499 p.29 Table 22 (Rd 5.1 k\u03a9 internal); ESP32-S3-MINI-1 datasheet v1.7 p.11 Table 3-1 (IO19 USB_D-, IO20 USB_D+)"
text = "The CC pins use the STUSB4500's internal 5.1 k\u03a9 Rd, so no external resistors are needed. D+/D- go straight to the ESP32-S3's native USB pins IO20/IO19 (3.3 V PHY)."

