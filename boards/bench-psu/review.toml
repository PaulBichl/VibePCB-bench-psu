[[item]]
id = "J1:pinout"
verdict = "ok"
pin = ""
cite = "SHOU HAN TYPE-C 16PIN 2MD(073) (LCSC C2765186) USB-C 16P receptacle pin names"
text = "Both VBUS pads, both GND pads, CC1/CC2 to U1, Dn1/Dn2 joined to USB_DN and Dp1/Dp2 to USB_DP, SBU left open, and the shell (EH1-4) goes to USB_SHIELD. That is the standard USB 2.0 sink wiring."

[[item]]
id = "J1:current"
verdict = "ok"
pin = ""
cite = "LCSC / JLCPCB C2765186 spec table: power current rating 3 A (description text says 5 A)"
text = "The 20 V / 3 A PD contract equals the 3 A rating in the spec table, with 2 VBUS pads and 2 GND pads in parallel. There is no margin if the 3 A figure is the true rating."

[[item]]
id = "J1:protection"
verdict = "ok"
pin = ""
cite = "ST DS12499 STUSB4500 Fig. 10 p.26 (ESDA25P35 on VBUS, ESDA25W on CC)"
text = "Protection matches ST's reference: D2 (ESDA25P35-1U1M) on VBUS, U8 (ESDA25W) on CC1/CC2, U2 (USBLC6-2SC6) on D+/D-, and the shield goes to GND through 1 MOhm + 4.7 nF. Reverse polarity cannot happen on USB-C, and overcurrent is left to the PD source."

[[item]]
id = "J1:levels"
verdict = "ok"
pin = ""
cite = "ST DS12499 Table 22 p.29 (Rd 5.1 kOhm internal); sec. 2.2.2 p.5 (CCxDB to CCx)"
text = "The CC pull-downs are the STUSB4500's internal 5.1 kOhm Rd, and dead-battery mode is enabled because CC1DB/CC2DB are tied to CC1/CC2. D+/D- are 3.3 V signals going to ESP32 IO19/IO20."

