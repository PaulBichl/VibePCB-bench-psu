cite = "SHOU HAN TYPE-C 16PIN 2MD(073) (LCSC C2765186) pin names; USB Type-C receptacle pinout"
text = "Both VBUS and both GND pins tied, Dp1/Dp2 -> USB_DP and Dn1/Dn2 -> USB_DN (orientation-independent USB 2.0), CC1/CC2 kept separate to U1, SBU open, shell EH1..4 to USB_SHIELD."

[[item]]
id = "J1:current"
verdict = "ok"
pin = ""
cite = "LCSC/JLCPCB C2765186 listing: rated current 3 A"
text = "Intent input is 20 V / 3 A, exactly the connector's 3 A rating (also the USB-C non-e-marked cable limit); both VBUS and both GND pins are used. No margin, but within rating; firmware must keep the sum inside the PD contract."

[[item]]
