[[item]]
id = "board:cap-ratings"
verdict = "ok"
pin = ""
cite = "LCSC: C13585 CL31A106KBHNNNE 50 V; C107083 CC0603KRX7R9BB224 50 V; C12891 CL31A226KAHNNNE 25 V; C45783 CL21A226MAQNNNE 25 V; C15849 50 V; C14663 50 V; C15850 25 V; C21120 25 V; C21117 50 V; C565695 1 kV"
text = "The VIN and VBUS caps (20-21 V) are all 50 V parts (\u2264 42 %), the OUTn 22 \u00b5F are 25 V (16.6 V = 66 %), V5 caps are 25 V and the electrolytics are 35 V. DC-bias loss on the output caps (about 18 \u00b5F left at 16 V) is already counted in U11/U21:output-cap."

[[item]]
id = "board:resistor-power"
verdict = "ok"
