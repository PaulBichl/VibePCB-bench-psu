text = "VBUS has D2 ESDA25P35 (VRM 22 V \u2265 21 V max VBUS), CC1/CC2 have U8 ESDA25W (VRM 24 V, as in ST's reference), D+/D- have U2 USBLC6-2SC6. Overcurrent is limited by the PD source; reverse polarity does not apply to Type-C."

