text = "At 16.6 V / 3 A from 19-20 V, D is about 0.88, below the 0.966 limit set by 85 ns tOFF_MIN at 400 kHz. At 1.6 V from 21 V, tON is about 190 ns, above 108 ns."

[[item]]
id = "U11:output-cap"
verdict = "unknown"
pin = ""
cite = "TI LMR33630 SNVSAN3F p.20 Table 9-2 (400 kHz, 12 V: 4 x 22 uF), p.22-23 sec. 9.2.2.5"
text = "4 x 22 uF 25 V 1206 X5R matches TI's table, but at 16 V DC bias only ~18 uF remain. The FB network keeps a feedback gain of 0.625 at every Vout (10x TI's design at 16 V), so stability rests on the R111/C113 lag network and a sim using unpublished internal compensation values. Measure the loop (Bode or 2 A step) at 1.6, 5 and 16.6 V before release."

[[item]]
id = "U11:input-cap"
verdict = "ok"
pin = "VIN"
cite = "TI LMR33630 SNVSAN3F p.23 sec. 9.2.2.6 (>= 10 uF ceramic + 220 nF X7R 50 V)"
text = "C101/C102 2 x 10 uF 50 V X5R 1206 (~9 uF at 20 V) plus C103 100 nF 50 V, plus the shared 100 uF bulk C6. The HF cap is 100 nF rather than TI's 220 nF, which is acceptable; placement is not visible here."

[[item]]
id = "U11:output-voltage"
verdict = "issue"
pin = "FB"
cite = "TI LMR33630 SNVSAN3F p.7 sec. 7.5 (VFB 0.985-1.015 V)"
text = "Vout = 1.6 V + 120 kOhm x Isink, with Isink = VSET / R104. VSET maxes at 3.3 V x 10k / (10k+100k+10k) = 0.275 V, so Isink is at most 115 uA and Vout_max is about 15.2 V (14.8-15.7 V with tolerances), not the intended 16.6 V. Fix: R104/R204 2.4 kOhm -> 2.2 kOhm (Vout_max ~16.5 V), or R108/R208 10 kOhm -> 11 kOhm, plus firmware calibration."

[[item]]
id = "U11:control-pins"
verdict = "ok"
pin = "EN"
cite = "TI LMR33630 SNVSAN3F p.5 Table 6-1 (PG may be left open), p.7 sec. 7.5 (VEN-H 1.26 V max)"
text = "EN1 is driven from the MCU through R110 10 kOhm against R109 100 kOhm and the two 47 kOhm base loads, giving ~2.35 V (> 1.26 V). INA226 Alert can pull it low, and R109 holds it low with the MCU off. PG is open."

[[item]]
id = "U11:inductor"
verdict = "issue"
pin = ""
cite = "TI LMR33630 SNVSAN3F p.22 Eq. 5 (L_MIN >= 0.28 x VOUT / fSW), p.21 sec. 9.2.2.4; FXL1040-100-M (JLCPCB C475915: 10 uH +-20 %, Isat 8.5 A)"
text = "L_MIN at 16.6 V / 400 kHz is 11.6 uH, but L11 is 10 uH (8 uH at -20 %), so it is below TI's minimum above ~14 V out (~11 V at tolerance). That risks subharmonic oscillation at high duty. Use 15 uH (TI's 12 V / 400 kHz value) with Isat >= 5.05 A (ISC max)."

[[item]]
id = "U11:thermal"
verdict = "ok"
