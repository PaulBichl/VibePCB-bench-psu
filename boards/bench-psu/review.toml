cite = "SS54 datasheet (VRRM 40 V, IF 5 A); TI SNVSAN3F p.6 note 3 (VOUT must not go below 0 V)"
text = "D13/D23 SS54 clamp a reverse-connected or negative output to protect the LMR33630 (VOUT must not fall below 0 V); C25/C26 100 \u00b5F absorb ESD at the terminals and the CC loop + INA226 trip limit the current. There is no protection against an external source back-feeding above 16.6 V (acceptable for a bench supply)."

