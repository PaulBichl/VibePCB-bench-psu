cite = "TI LMR33630 SNVSAN3F p.7 sec. 7.4 (RthJA 42.9 C/W DDA, JEDEC 4L), p.8 (RDS-ON HS 95/160 mOhm, LS 66/110 mOhm), p.24-25 sec. 9.2.2.11"
text = "At 16.6 V / 3 A, conduction plus switching loss is about 1.1-1.4 W, so Tj is about 45 C + 1.4 W x 43 C/W = 105 C, below 125 C. The EP is on GND. Margin is thin with both channels at full load in one enclosure."

[[item]]
id = "U11:current-budget"
verdict = "issue"
pin = ""
cite = "TI LMR33630 SNVSAN3F p.6 sec. 7.3 (IOUT 3 A max), p.7 (ISC 3.85 A min), p.8 (fSW 340 kHz min)"
text = "The intent runs 3.0 A, exactly the 3 A rating with no margin, and the ISET hardware range goes to 3.3 A. With 10 uH -20 % at 340 kHz and Vout ~10 V, the peak is 3 A + 0.92 A = 3.9 A, above the 3.85 A ISC min, so the part can current-limit before CC takes over. Use 15 uH (peak ~3.6 A) and cap firmware ISET at <= 2.8-3.0 A, or move to the LMR33640 (4 A)."

