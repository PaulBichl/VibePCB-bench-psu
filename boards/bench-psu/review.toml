cite = "TI SNVSAN3F p.21 Eq. 4, p.22 Eq. 5 (LMIN = 0.28 Vout / fsw), p.7 ISC 5.05 A max; Changjiang FXL1040-150-M Isat 7 A, Irms 6.5 A, DCR 45 mOhm"
text = "At worst case (10 V out from 20 V, K = 0.3, 3 A), Eq. 4 gives 13.9 uH; LMIN at 16.6 V is 11.6 uH, so 15 uH fits. Isat 7 A is above the 5.05 A ISC max."

