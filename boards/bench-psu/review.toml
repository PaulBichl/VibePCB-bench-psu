text = "R130/R131/R132 10 k\u03a9 to 3.3 V give 0.33 mA, below the encoder's 1 mA minimum (A, B) and the switch's 500 \u00b5A minimum (E), which risks unreliable contact wetting. Fix: 3.3 k\u03a9 pull-ups on ENC1_A/ENC1_B (1 mA) and 4.7 k\u03a9 or less on ENC1_SW, keeping the RC filter (retune C130-C132 to about 33 nF to keep the time constant)."

