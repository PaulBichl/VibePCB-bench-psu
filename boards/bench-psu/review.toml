text = "VBUS has D2 (ESDA25P35-1U1M, 22 V standoff > 21 V max PD 20 V+5 %), CC1/CC2 have U8 (ESDA25W), D+/D- have U2 (USBLC6-2SC6), shield via R2 1 M\u03a9 || C5 4.7 nF; matches ST's reference. No fuse: overcurrent relies on the PD source's OCP."

