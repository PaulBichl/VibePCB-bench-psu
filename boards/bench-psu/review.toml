cite = "LMR33630 SNVSAN3F p.23 \u00a79.2.2.6 (>= 10 \u00b5F effective ceramic plus a 220 nF 50 V X7R as close as possible to VIN)"
text = "U11 has C101 + C102 10 \u00b5F 50 V 1206 (about 4.5 \u00b5F each at 20 V, about 9 \u00b5F effective) and C103 100 nF, not the required 220 nF HF cap. Fix: make C103 a 220 nF 50 V X7R next to VIN/PGND; consider a third 10 \u00b5F."

