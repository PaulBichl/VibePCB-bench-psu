cite = "LMR33630 SNVSAN3F p.7 Table 7.4 (R\u03b8JA 42.9 C/W DDA, JEDEC); p.25 Fig. 9-3 (25-42 C/W, 4-layer); p.8 (RDS-ON max 160/110 m\u03a9)"
text = "Worst case at 10 V / 3 A: conduction 9 A\u00b2 x ~0.135 \u03a9 \u2248 1.2 W plus about 0.15 W switching. That gives Tj \u2248 45 C + 1.35 W x 43 C/W \u2248 103 C, under 125 C. The EP is on GND."

