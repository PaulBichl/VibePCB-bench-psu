[[item]]
id = "J1:pinout"
verdict = "ok"
pin = ""
cite = "USB Type-C receptacle pin assignment (USB-C spec R2.x); SHOU HAN TYPE-C 16PIN 2MD(073) listing C2765186"
text = "Both VBUS and both GND contacts used, CC1/CC2 separate to U1, Dp1/Dp2 and Dn1/Dn2 paired to USB_DP/USB_DN, SBU open, shell to USB_SHIELD (1 MOhm || 4.7 nF to GND)."

[[item]]
id = "J1:current"
verdict = "unknown"
pin = ""
cite = "JLCPCB/LCSC C2765186 listings (no manufacturer datasheet found)"
text = "Distributor listings disagree: 3 A / 5 V (JLCPCB, LCSC product page) vs 5 A (LCSC category list, HQOnline); the board draws up to ~2.9 A at 20 V from VBUS. Need the SHOU HAN drawing to confirm >= 3 A per VBUS/GND pair at 20 V, otherwise use a 5 A rated 16P/24P receptacle."

[[item]]
id = "J1:protection"
verdict = "issue"
pin = "CC1"
cite = "ST STUSB4500 DS12499 Rev 3 p.25 Fig. 9 (ESDA25W on CC, ESDA25P35 on VBUS), p.27 Table 20 (VDD 28 V, CC 22 V abs max, ESD HBM 3 kV)"
text = "CC1/CC2 go straight from J1 to U1 with no ESD diode (ST reference uses ESDA25W), and VBUS has no TVS ahead of Q1: D1 (SMBJ22A) sits on VIN, so U1 VDD/VBUS_VS_DISCH (28 V abs max) see hot-plug transients unclamped. Add a 22-25 V CC ESD array (e.g. ESDA25W) on CC1/CC2 and a TVS (e.g. ESDA25P35 or SMBJ22A) on VBUS at J1; D+/D- are covered by U2."

[[item]]
id = "J1:levels"
verdict = "ok"
pin = ""
cite = "ST STUSB4500 DS12499 Rev 3 p.29 Table 22 (Rd 5.1 kOhm internal); Espressif ESP32-S3-MINI-1 v1.7 p.11 Table 3-1 (IO19 USB_D-, IO20 USB_D+)"
text = "CC Rd 5.1 kOhm is internal to U1 (dead-battery via CC1DB/CC2DB). USB D+/D- go directly to the ESP32-S3 internal USB PHY (3.3 V), with U2 ESD."

