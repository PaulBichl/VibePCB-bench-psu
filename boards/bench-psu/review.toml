text = "IC loss at 3 A is about 1-1.3 W (buck_loadpoints.cir, max RDS-ON), giving Tj around 45 C + 1.3 W x 43 C/W = 101 C, below 125 C. The EP is on GND; the NTCs give a firmware backstop."

[[item]]
id = "U11:current-budget"
verdict = "issue"
pin = ""
cite = "TI SNVSAN3F p.6 7.3 (IOUT max 3 A), p.7 ILIMIT (low-side valley) 2.9 A min"
text = "The intent's 3 A per channel equals the 3 A rating, with no margin. With 15 uH the guaranteed average current limit is ILIMIT min + ripple/2 = 2.9 A + 0.12 A = 3.02 A at 1.6 V out, and ISET full scale (3.3 V at 1 V/A) allows 3.3 A. Fix: rate the channel and the firmware CC/INA226 ceiling at about 2.8 A."

