[[item]]
id = "U3:inductor"
verdict = "issue"
pin = ""
cite = "TI LMR33630 SNVSAN3F p.21-22 sec. 9.2.2.4 (Isat ideally >= ISC 3.85-5.05 A; must not be less than ILIMIT 2.9-4.1 A, p.7); SWPA4030S150MT (JLCPCB C83475: 15 uH, Isat 1.65 A, Irms 1.11 A, DCR 247 mOhm)"
text = "L1 at 15 uH meets L_MIN (3.6 uH) with 0.64 A p-p ripple, but its 1.65 A Isat is below the 2.9 A ILIMIT minimum TI says it must not fall under. A V5 short or start-up into the caps saturates it at the 4.5 A current limit. Use 10-15 uH with Isat >= 4.1 A (ideally >= 5 A), e.g. a 5x5 or 6x6 mm molded part."

