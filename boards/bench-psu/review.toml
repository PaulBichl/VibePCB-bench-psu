cite = "LCSC / JLCPCB C2765186 listings (no manufacturer datasheet obtained)"
text = "The 20 V / 3 A contract puts 3 A through the two VBUS and two GND pads; distributor listings give 3 A (product page) and 5 A (category list) for this SHOU HAN 16P receptacle. At 3 A there is no margin: confirm the VBUS contact rating in the manufacturer datasheet or choose a 5 A-rated receptacle."

