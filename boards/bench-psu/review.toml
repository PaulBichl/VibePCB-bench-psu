[[item]]
id = "J2:protection"
verdict = "ok"
pin = ""
cite = "SS54 datasheet (VRRM 40 V, IF 5 A); INA181 SBOS793 abs max VCM 26 V; INA226 SBOS547 abs max 40 V"
text = "Each output has a reverse-clamp Schottky (D13/D23) and more than 88 \u00b5F of capacitance to absorb ESD, and current is limited by the CC loop and the INA226 trip. There is no overvoltage clamp: an external source above 25 V on a terminal would exceed C106-C109 (25 V) and the INA181 (26 V). That is acceptable for a bench supply."

