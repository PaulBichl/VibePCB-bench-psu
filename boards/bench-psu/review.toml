cite = "LCSC C105360 FMF25FPJR020-LH: 20 m\u03a9 2512 2 W"
text = "R101/R201 dissipate 9 A\u00b2 x 20 m\u03a9 = 0.18 W against 2 W. R121/R221 take 16.6 V\u00b2 / 4.7 k\u03a9 = 59 mW, and only during discharge. R1 1 k\u03a9 sees 20 mA pulses (VBUS discharge of about 1 \u00b5F). Everything else is under 5 mW."

[[item]]
id = "board:current-path"
verdict = "ok"
pin = ""
cite = "J1 5 A (LCSC C2765186); AO4407A -12 A; intent [supply] 3 A"
text = "The 3 A input runs through J1 (5 A rating) and Q1 (12 A rating), and the PD source's current limit protects the path, so having no fuse is acceptable. Two channels at 16.6 V / 3 A (about 100 W) exceed the 60 W contract, which the intent leaves to the firmware's power budget."

[[item]]
id = "board:intent"
verdict = "issue"
pin = ""
cite = "LMR33630 SNVSAN3F p.15 sec. 8.3.3 (FB < 0.4 V during current limit enters hiccup: 94 ms off, then soft-start restart); p.9 VHC 0.4 V"
text = "Rails match the intent (V5 5.17 V, V3V3 3.3 V, OUTn 1.6-16.6 V), but the CC claim fails into a hard short. The intent itself says the buck runs at its own 4.5 A limit for about 2 ms before the CC loop takes over. With FB = 0.625 x VOUT, any VOUT below about 0.64 V (e.g. a 0.05 \u03a9 short) puts FB under 0.4 V and the LMR33630 hiccups instead of regulating Iset. Fix: test a hard short on the prototype; if it hiccups, make the CC loop engage faster (pre-bias U7's output to just below D14 conduction) or accept and document hiccup-mode short-circuit behaviour."

[[item]]
id = "board:sims"
verdict = "issue"
pin = ""
cite = "LMR33630 SNVSAN3F p.15 sec. 8.3.3 (hiccup at VFB < 0.4 V in current limit); p.22-23 sec. 9.2.2.5 (Bode/transient testing required)"
text = "buck_loop, cc_loop and powerup_ch rest on assumed internal compensation (gm 1 mS, Rc 12 k\u03a9, Cc 4.7 nF, Ri 0.1 V/A, which the decks admit are unpublished), so their phase-margin results are not proof. None of the averaged models includes the VFB < 0.4 V hiccup, and cc_loop's transient only tests 20 \u03a9 to 2 \u03a9, never a short, though it reports AC margins at 0.05 \u03a9. Fix: add a hiccup comparator (current limit and FB < 0.4 V) and a hard-short transient to cc_loop, and confirm loop stability with a Bode measurement on hardware."
