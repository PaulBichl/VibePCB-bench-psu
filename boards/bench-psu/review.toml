[[item]]
id = "board:cap-ratings"
verdict = "ok"
pin = ""
cite = "JLCPCB C12891 (CL31A226KAHNNNE 22 uF 25 V 1206 X5R), C13585 (10 uF 50 V 1206), C14663/C15849/C57112 (50 V 0603), C53987 (4.7 nF 50 V X7R), C21120 (220 nF 16 V), C970686 (100 uF 35 V)"
text = "VIN (20 V) parts are 50 V ceramics plus the 35 V electrolytic (57 %). OUT1/OUT2 use 25 V parts at 16.6 V (66 %, ~18 uF left of 88 uF). C113/C213 (16 V) sit at 1.5 V or less, and C19 sees 14 V or less. Low DC-bias capacitance on V5 is covered in U3:output-cap."

[[item]]
id = "board:resistor-power"
verdict = "issue"
pin = ""
cite = "LCSC C105360 (FMF25FPJR020-LH, 2512, 2 W); JLCPCB C21190 (0603WAF1001T5E, 0603, 0.1 W); ST STUSB4500 DS12499 p.29 Table 22 (TDISUSBPDO 288 ms, IDISUSB 50 mA)"
text = "R101/R201 at 3 A dissipate 0.18 W in a 2 W 2512 (ok). R121/R221 (1 kOhm 0603, 0.1 W) take V^2/1k = 0.28 W at 16.6 V whenever the channel is off with an external source or battery on the terminals, and R1 (0603) peaks at 0.4 W discharging VIN bulk from 20 V. Use 1206 (0.25 W) or larger for R121/R221 (or raise to 2.2 kOhm) and 0805/1206 for R1."

[[item]]
id = "board:current-path"
verdict = "ok"
pin = ""
cite = "AOS AO4407A (ID -12 A); USB PD source OCP; intent [supply] 20 V / 3 A"
text = "Input current is at most ~2.9 A (16.6 V x 3 A at ~90 % plus logic). There is no fuse; overcurrent relies on the PD source's OCP, and the two-channel sum depends on a firmware power budget. The J1 rating is open (see J1:current); trace widths are not visible in the review files."

[[item]]
id = "board:intent"
verdict = "issue"
pin = ""
cite = "TI LMR33630 SNVSAN3F p.7 (VFB 1 V); Diodes AP2112 DS39724 p.3 (thetaJA 184 C/W)"
text = "The intent says outputs reach 16.6 V, but the VSET network (R106/R107/R108 into R104 2.4 kOhm) caps Isink at 115 uA, so Vout_max is about 15.2 V. Fix R104/R204 to 2.2 kOhm. The 0.4 A V3V3 budget also contradicts the AP2112 thermal limit (see U4:thermal)."

[[item]]
id = "board:sims"
verdict = "issue"
pin = ""
cite = "sim/buck_loop.cir, cc_loop.cir, powerup_*.cir, buck_loadpoints.cir; TI LMR33630 SNVSAN3F p.7-8"
text = "Phase-margin and step results in buck_loop/cc_loop/powerup use invented internal compensation (gm 1 mS, Rc 12k, Cc 4.7 nF; the header admits these are not published), so they show trends but do not prove stability. buck_loadpoints only runs Vout 1.6/5/16 V, which misses the worst inductor peak near 10 V (D = 0.5), so il_peak_max under ISC 3.85 A is not proven. powerup_ch drives the sink current directly, bypassing the R104/R106-R108 VSET path, so it hides the 15.2 V ceiling."
