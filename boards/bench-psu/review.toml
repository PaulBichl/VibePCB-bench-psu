cite = "TI SNVSAN3F p.23 9.2.2.6 (>= 10 uF ceramic, 220 nF 50 V X7R close to VIN)"
text = "Local caps are C101/C102 (10 uF 50 V 1206, ~9 uF effective at 20 V) + C103 (220 nF 50 V X7R, CC0603KRX7R9BB224), with C6 100 uF + C7-C9 on the same VIN net. Placement next to pin 2 cannot be checked here."

[[item]]
id = "U11:output-voltage"
verdict = "issue"
pin = "5"
cite = "TI SNVSAN3F p.6 sec. 7.1: FB abs max 5.5 V; p.7 VFB 0.985-1.015 V"
text = "The range is right: Vout = 1.0 V x (1 + 120k/200k) + 120 kOhm x VSET / 2.2 kOhm gives 1.6-16.6 V. But FB = 0.625 x (OUT1 - 120 kOhm x Isink). When the set point drops, PWM/3V3 is lost or EN goes low at light load, the buck cannot pull OUT1 down, and FB reaches 0.625 x 16.6 V = 10.4 V for up to seconds, far above the 5.5 V abs max. Fix: clamp FB with a low-leakage diode (e.g. 1N4148W) to V3V3, or add a load that discharges the output on set-point decreases."

[[item]]
id = "U11:control-pins"
verdict = "ok"
pin = "3"
cite = "TI SNVSAN3F p.5 Table 6-1 (PG may be left open), p.7 VEN-H 1.26 V max, p.6 EN <= VIN + 0.3 V"
text = "EN1 is about 2.3 V when the MCU drives it high (10 kOhm into 100 kOhm plus two 47 kOhm base loads), above 1.26 V. R109 holds EN low during MCU reset, and PG is left open, which is allowed."

[[item]]
id = "U11:inductor"
verdict = "ok"
