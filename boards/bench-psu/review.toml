text = "NTC1/NTC2 are on IO1/IO2 (ADC1_CH0/CH1, usable with Wi-Fi on), USB on IO19/IO20, and IO47 (pin 27) is available on the N8 module. PWM (LEDC), I2C and GPIO inputs can use any pin through the GPIO matrix, and no 5 V signals reach the MCU."

