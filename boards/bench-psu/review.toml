text = "V5 has only C12/C13, 2 x 22 uF 0805, about 22-24 uF effective at 5.17 V DC bias, against TI's validated 4 x 22 uF for 5 V / 400 kHz on an internally compensated loop. Less Cout raises the crossover and cuts phase margin, and Eq. 6 for a 0.35 A step at 100 mV already needs ~28 uF. Add two more 22 uF (25 V, 1206 preferred)."

