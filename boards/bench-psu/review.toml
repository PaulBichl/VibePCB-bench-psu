[[item]]
id = "board:cap-ratings"
verdict = "ok"
pin = ""
cite = "LCSC: C13585 CL31A106KBHNNNE 50 V; C12891 CL31A226KAHNNNE 25 V; C45783 CL21A226MAQNNNE 25 V; C15849 CL10A105KB8NNNC 50 V; C14663 / C107083 50 V X7R; C53987 50 V; C970686 RVT 35 V"
text = "VIN (\u2264 21 V) uses 50 V ceramics and the 35 V electrolytic (\u2264 60 %); OUTn (\u2264 16.6 V) uses 25 V parts (66 %); V5 uses 25 V parts. DC bias is heavy on the 1206 10 \u00b5F at 20 V and 22 \u00b5F at 16.6 V (\u2248 18 \u00b5F total output), which the sims already model; C15850/C21120/C100042 sit only on \u2264 3.3 V nets."

[[item]]
id = "board:resistor-power"
verdict = "ok"
pin = ""
cite = "LCSC C105360 FMF25FPJR020-LH (20 m\u03a9 2512, 2 W); ST DS12499 p.9 \u00a72.2.12, p.27 (IDISUSB \u2264 50 mA)"
text = "R101/R201 take 3\u00b2 \u00d7 20 m\u03a9 = 0.18 W (0.4 W at a 4.5 A peak) against 2 W; R121/R221 take 16.6\u00b2 / 4.7 k\u03a9 = 59 mW in 0603. R1 1 k\u03a9 sees up to 0.44 W only for the short VBUS discharge pulses (same value as ST Fig. 8), and LED and divider resistors are under 5 mW."

[[item]]
id = "board:current-path"
verdict = "unknown"
pin = ""
cite = "LCSC / JLCPCB C2765186 listings (3 A); AOS AO4407A p.1-2; USB PD spec sink bulk-capacitance limit not looked up"
text = "There is no fuse (the PD source limits current). J1 is listed at 3 A, equal to the full 3 A contract (see J1:current). About 130 \u00b5F (C6 100 \u00b5F + 7 \u00d7 10 \u00b5F derated) is switched onto VBUS by Q1 during PD voltage transitions; check it against the USB PD sink bulk-capacitance limit (cSnkBulkPd)."

[[item]]
id = "board:intent"
verdict = "ok"
pin = ""
cite = "TI SNVSAN3F p.7 (VFB); Diodes DS39724 p.1; ST DS12499 p.21 Table 18"
text = "V5 is 5.17 V, V3V3 is 3.3 V, OUTn is 1.6-16.6 V (R102/R103 + VSET sink) and per-channel 3 A is within the LMR33630 rating; the NVM default 20 V / 1 A matches the intent note. The one contradiction is the 5 V-only / 5 V-attach logic supply, which depends on the marginal Q1 gate drive (see Q1:gate-drive)."

[[item]]
id = "board:sims"
verdict = "issue"
pin = ""
cite = "TI SNVSAN3F p.22-23 \u00a79.2.2.5 (Bode plots and load transients must be validated); p.7-8 (ISC, ILIMIT, RDS-ON, tSS 2.9-6 ms)"
text = "buck_loop, cc_loop and both powerup decks rest on an assumed internal compensation (gm 1 mS, Rc 12 k\u03a9, Cc 4.7 nF, Ri 0.1 V/A) that the datasheet does not publish, so their phase-margin and step results for this fixed-gain FB network are not datasheet-backed. buck_loop also does not measure the 1 ms recovery claimed in intent. Fix: confirm by bench Bode (inject at R102/R202) and 2 A steps at 1.6 V and 16.6 V; buck_loadpoints (max RDS-ON, ISC min) is properly sourced."
