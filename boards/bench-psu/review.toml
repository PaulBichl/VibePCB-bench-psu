[[item]]
id = "U3:inductor"
verdict = "issue"
pin = "8"
cite = "LMR33630 SNVSAN3F p.21-22 sec. 9.2.2.4 (Isat ideally \u2265 ISC, never below ILIMIT); p.7 Table 7.5 (ISC 3.85-5.05 A, ILIMIT max 4.1 A); FXL0530-6R8-M (JLCPCB C177249: Isat 4 A, Irms 3.5 A)"
text = "L1 FXL0530-6R8-M saturates at 4 A. That is below the LMR33630's high-side current limit (up to 5.05 A) and below the maximum low-side limit of 4.1 A, so a short on V5 can saturate the inductor. Ripple is 1.38 A, 46 % of 3 A. Fix: use a 6.8-8.2 \u00b5H part with Isat \u2265 5.1 A (TI's table uses 8 \u00b5H for 5 V at 400 kHz)."

