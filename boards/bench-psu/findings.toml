# Review findings (format: src/vibepcb/findings.py). Set status = "accepted" with a reason to close one.

[[finding]]
id = "review:J3:pinout"
ref = "J3"
pin = "1"
text = "The header order is 1 GND, 2 VCC (3.3 V), 3 SCL, 4 SDA, which matches the common 4-pin SSD1306 I2C OLED module. No module MPN or datasheet is given, though, and some modules swap VCC and GND. Name the module and confirm its pin order. [PZ254V-11-04P 2.54 mm header (LCSC C492403)] (reviewer could not decide)"
status = "accepted"
reason = "the OLED module is bought separately: J3's silkscreen reads GND VCC SCL SDA and the README bring-up (step 2.2) says to check the module's header order before plugging it in (a swapped module would reverse 3V3)"
source = "review"

[[finding]]
id = "review:U11:output-cap"
ref = "U11"
pin = ""
text = "4x22 \u00b5F 25 V X5R (about 18 \u00b5F at 16 V) plus 100 \u00b5F electrolytic meets Eq. 6 for a 2 A / 400 mV step and stays under the 1000 \u00b5F ceiling. However, the fixed FB gain of 0.625 at every output voltage plus the R111/C113 lag network is outside TI's characterised cases, and the loop decks use unpublished compensation values. Stability needs a Bode or step measurement on the prototype at 1.6 V and 16 V. [LMR33630 SNVSAN3F p.20 Table 9-2 (12 V/400 kHz: 4x22 \u00b5F, RFBT 100 k\u03a9); p.22-23 sec. 9.2.2.5 (Bode/transient testing required; max ~10x design or 1000 \u00b5F)] (reviewer could not decide)"
status = "accepted"
reason = "the loop rests on TI's unpublished internal compensation: the decks use derived constants and show CV phase margin >= 63 deg for any ESR 0.05..1 Ohm of C25/C26 (wide margin, not a datasheet proof); the README bring-up measures the loop (injection at R102/R202, 2 A steps at 1.6 and 16.6 V) before use"
source = "review"

