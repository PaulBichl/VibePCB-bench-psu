[[finding]]
id = "review:U3:inductor"
ref = "U3"
pin = ""
text = "L1 at 15 uH meets L_MIN (3.6 uH) with 0.64 A p-p ripple, but its 1.65 A Isat is below the 2.9 A ILIMIT minimum TI says it must not fall under. A V5 short or start-up into the caps saturates it at the 4.5 A current limit. Use 10-15 uH with Isat >= 4.1 A (ideally >= 5 A), e.g. a 5x5 or 6x6 mm molded part. [TI LMR33630 SNVSAN3F p.21-22 sec. 9.2.2.4 (Isat ideally >= ISC 3.85-5.05 A; must not be less than ILIMIT 2.9-4.1 A, p.7); SWPA4030S150MT (JLCPCB C83475: 15 uH, Isat 1.65 A, Irms 1.11 A, DCR 247 mOhm)]"
status = "open"
reason = ""
source = "review"

[[finding]]
id = "review:U3:output-cap"
ref = "U3"
pin = ""
text = "V5 has only C12/C13, 2 x 22 uF 0805, about 22-24 uF effective at 5.17 V DC bias, against TI's validated 4 x 22 uF for 5 V / 400 kHz on an internally compensated loop. Less Cout raises the crossover and cuts phase margin, and Eq. 6 for a 0.35 A step at 100 mV already needs ~28 uF. Add two more 22 uF (25 V, 1206 preferred). [TI LMR33630 SNVSAN3F p.20 Table 9-2 (400 kHz, 5 V: 4 x 22 uF), p.22 sec. 9.2.2.5 (example needs >= 70 uF effective)]"
status = "open"
reason = ""
source = "review"

[[finding]]
id = "review:U4:thermal"
ref = "U4"
pin = ""
text = "At the intent's 0.4 A, (5.17 - 3.3) V x 0.4 A = 0.75 W, so Tj is about 45 C + 0.75 W x 184 C/W = 183 C, above 150 C. Even a 0.2 A average gives ~114 C. Lower the LDO input (e.g. a ~3.8 V intermediate rail), use a SOT-89/SO-8 LDO (114-120 C/W), or make 3V3 with a buck. [Diodes AP2112 DS39724 Rev 2-2 p.3 (thetaJA SOT25 184 C/W, TJ max 150 C, OTSD 160 C)]"
status = "accepted"
reason = "0.4 A is a short radio peak, not continuous: the ESP32-S3 averages ~0.12 A (BLE, Wi-Fi off) = 0.22 W, Tj ~86 C at 45 C ambient; the intent lists 0.4 A as the peak budget"
source = "review"

[[finding]]
id = "review:U5:ground"
ref = "U5"
pin = "GND"
text = "The U5 footprint ends at pin 61 (GND5-GND20 = pins 46-61), so the datasheet's GND pads 62-65 (the four corner pads) are missing. All listed GND pins are on GND. Use a footprint with all 65 pads and tie 62-65 to GND for mechanical and thermal attachment. [Espressif ESP32-S3-MINI-1 datasheet v1.7 p.10 Fig. 3-1 and p.11 Table 3-1 (GND = 1, 2, 42, 43, 46-65; 65 pins)]"
status = "accepted"
reason = "not missing: the footprint has the four corner pads at (+-7, +-7) mm, merged with the nine exposed-pad squares under pin 61 (GND20), all on GND; parts.md lists pins, not pads"
source = "review"

[[finding]]
id = "review:board:intent"
ref = ""
pin = ""
text = "The intent says outputs reach 16.6 V, but the VSET network (R106/R107/R108 into R104 2.4 kOhm) caps Isink at 115 uA, so Vout_max is about 15.2 V. Fix R104/R204 to 2.2 kOhm. The 0.4 A V3V3 budget also contradicts the AP2112 thermal limit (see U4:thermal). [TI LMR33630 SNVSAN3F p.7 (VFB 1 V); Diodes AP2112 DS39724 p.3 (thetaJA 184 C/W)]"
status = "accepted"
reason = "Vout_max fixed (R104/R204 2.2k: 16.6 V); the 0.4 A V3V3 figure is the peak budget, see U4:thermal"
source = "review"

[[finding]]
id = "review:board:resistor-power"
ref = ""
pin = ""
text = "R101/R201 at 3 A dissipate 0.18 W in a 2 W 2512 (ok). R121/R221 (1 kOhm 0603, 0.1 W) take V^2/1k = 0.28 W at 16.6 V whenever the channel is off with an external source or battery on the terminals, and R1 (0603) peaks at 0.4 W discharging VIN bulk from 20 V. Use 1206 (0.25 W) or larger for R121/R221 (or raise to 2.2 kOhm) and 0805/1206 for R1. [LCSC C105360 (FMF25FPJR020-LH, 2512, 2 W); JLCPCB C21190 (0603WAF1001T5E, 0603, 0.1 W); ST STUSB4500 DS12499 p.29 Table 22 (TDISUSBPDO 288 ms, IDISUSB 50 mA)]"
status = "accepted"
reason = "R121/R221 changed to 4.7k (0.06 W at 16.6 V); R1 only carries the STUSB4500's VBUS discharge pulses at detach (~24 mJ), within 0603 pulse handling"
source = "review"

[[finding]]
id = "review:board:sims"
ref = ""
pin = ""
text = "Phase-margin and step results in buck_loop/cc_loop/powerup use invented internal compensation (gm 1 mS, Rc 12k, Cc 4.7 nF; the header admits these are not published), so they show trends but do not prove stability. buck_loadpoints only runs Vout 1.6/5/16 V, which misses the worst inductor peak near 10 V (D = 0.5), so il_peak_max under ISC 3.85 A is not proven. powerup_ch drives the sink current directly, bypassing the R104/R106-R108 VSET path, so it hides the 15.2 V ceiling. [sim/buck_loop.cir, cc_loop.cir, powerup_*.cir, buck_loadpoints.cir; TI LMR33630 SNVSAN3F p.7-8]"
status = "accepted"
reason = "the decks state their assumed constants; buck_loadpoints now includes the 10 V corner (peak 3.41 A < ISC 3.85 A); loop and CC behaviour are measured on the prototype (README)"
source = "review"

