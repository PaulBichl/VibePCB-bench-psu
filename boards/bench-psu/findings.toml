[[finding]]
id = "review:J1:current"
ref = "J1"
pin = "VBUS1"
text = "The 20 V / 3 A contract puts 3 A through the two VBUS and two GND pads; distributor listings give 3 A (product page) and 5 A (category list) for this SHOU HAN 16P receptacle. At 3 A there is no margin: confirm the VBUS contact rating in the manufacturer datasheet or choose a 5 A-rated receptacle. [LCSC / JLCPCB C2765186 listings (no manufacturer datasheet obtained)] (reviewer could not decide)"
status = "accepted"
reason = "3 A is the USB Type-C rating for a standard cable and the PD contract is 3 A (60 W at 20 V): the connector is used at its rating, as on every 60 W USB-C sink; the firmware power budget keeps the sum of both channels inside it"
source = "review"

