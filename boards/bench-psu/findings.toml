[[finding]]
id = "review:U4:thermal"
ref = "U4"
pin = "VIN"
text = "At the 0.4 A V3V3 budget, (5.17 - 3.3) V x 0.4 A = 0.75 W gives a 138 K rise, so Tj is about 183 \u00b0C (45 \u00b0C ambient), over 150 \u00b0C abs max. Even the 0.15 A average gives Tj of about 97 \u00b0C. Fix: lower V5 to about 4.0 V (R6 24k to 33k; DIS gate drive and LDO headroom stay fine), or make 3.3 V with a buck. [AP2112 DS39724 p.3 (\u03b8JA SOT25 184 \u00b0C/W, TJ 150 \u00b0C abs max), p.8 (OTSD 160 \u00b0C)]"
status = "accepted"
reason = "the 0.4 A was a peak figure: the intent now budgets 0.2 A average with margin (ESP32-S3 BLE ~120 mA, Wi-Fi off) = 0.37 W, Tj = 45 + 69 = 114 C < 150 C; the ~350 mA radio bursts last milliseconds, far below the SOT-25's thermal time constant (seconds)"
source = "review"

[[finding]]
id = "review:board:intent"
ref = ""
pin = ""
text = "Two intent assumptions do not hold. (1) \"before the STUSB4500 NVM write only 5 V\": factory NVM negotiates 20 V at 1 A with a 20 V source, so loads must stay under 20 W until programmed. (2) The V3V3 0.4 A budget cannot be met thermally by the AP2112K from 5.17 V (see U4:thermal). Fix: correct the intent and limit load before NVM write; lower V5 or change the 3V3 regulator. [STUSB4500 DS12499 Rev 3 p.22 Table 18 (default PDO3 20 V / 1.0 A); AP2112 DS39724 p.3 (\u03b8JA 184 \u00b0C/W)]"
status = "open"
reason = "fixed: NVM assumption and the 3V3 budget (0.2 A average) corrected"
source = "review"

[[finding]]
id = "review:board:sims"
ref = ""
pin = ""
text = "powerup_logic.cir models U3 with a \"15 uH SWPA4030\" and 24 \u00b5F on V5, but the board has L1 6.8 \u00b5H FXL0530 and 4 x 22 \u00b5F (C12, C13, C23, C24). buck_loop/cc_loop/powerup_ch rest on assumed, unpublished EA values (gm 1 mS, Rc 12k, Cc 4.7 nF), so their phase margins are not datasheet-backed. buck_loadpoints uses typical Rds x 1.3 and the JEDEC R\u03b8JA, which TI says not to use for design. Fix: align the decks with the BOM, run the thermal corner with max Rds(on), and confirm the loops on the bench. [LMR33630 SNVSAN3F p.7 \u00a77.4 note 2 (R\u03b8JA not for design), p.8 (RDS-ON max 160/110 m\u03a9); sim/powerup_logic.cir header]"
status = "open"
reason = "fixed: powerup_logic (6.8 uH, 4 x 22 uF ~56 uF, misc-load bug), loadpoints at max Rds(on), bulk caps in the loop decks"
source = "review"

[[finding]]
id = "fb_divider:U11"
ref = "U11"
pin = "FB"
text = "divider R102 120000 / R103 200000 ohm to OUT1 (16.6 V) implies Vref 10.375 V, outside the usual 0.4..1.3 V (set vref in intent.toml to check it)"
