# Review findings (format: src/vibepcb/findings.py). Set status = "accepted" with a reason to close one.

[[finding]]
id = "review:D101:orientation"
ref = "D101"
pin = "pin1"
text = "The circuit needs pin1 (via R112 to V3V3) = anode and pin2 (Q12 collector) = cathode, but the pins are only named pin1/pin2 and the KENTO page gives no pad polarity. Confirm the footprint's pad 1 is the anode, or the LED stays dark. (reviewer could not decide)"
status = "accepted"
reason = "pin1 = anode is verified: tscircuit's <led> names pin1 anode, the TSX wires .anode/.cathode by name and the netlist shows D101-D202 pin1 (+). Hand assembly: the silkscreen bracket closes on pad 1 = ANODE (opposite to the usual cathode mark), noted in the bring-up sheet"
source = "review"

