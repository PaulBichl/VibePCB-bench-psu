[[finding]]
id = "review:J1:current"
ref = "J1"
pin = ""
text = "Distributor listings disagree: 3 A / 5 V (JLCPCB, LCSC product page) vs 5 A (LCSC category list, HQOnline); the board draws up to ~2.9 A at 20 V from VBUS. Need the SHOU HAN drawing to confirm >= 3 A per VBUS/GND pair at 20 V, otherwise use a 5 A rated 16P/24P receptacle. [JLCPCB/LCSC C2765186 listings (no manufacturer datasheet found)] (reviewer could not decide)"
status = "accepted"
reason = "3 A per VBUS/GND pair is the 20 V / 3 A PD contract this board requests; the firmware power budget keeps the sum of both outputs inside the negotiated PDO"
source = "review"

[[finding]]
id = "review:J1:protection"
ref = "J1"
pin = "CC1"
text = "CC1/CC2 go straight from J1 to U1 with no ESD diode (ST reference uses ESDA25W), and VBUS has no TVS ahead of Q1: D1 (SMBJ22A) sits on VIN, so U1 VDD/VBUS_VS_DISCH (28 V abs max) see hot-plug transients unclamped. Add a 22-25 V CC ESD array (e.g. ESDA25W) on CC1/CC2 and a TVS (e.g. ESDA25P35 or SMBJ22A) on VBUS at J1; D+/D- are covered by U2. [ST STUSB4500 DS12499 Rev 3 p.25 Fig. 9 (ESDA25W on CC, ESDA25P35 on VBUS), p.27 Table 20 (VDD 28 V, CC 22 V abs max, ESD HBM 3 kV)]"
status = "open"
reason = ""
source = "review"

[[finding]]
id = "review:J3:pinout"
ref = "J3"
pin = ""
text = "J3 order is GND, VCC, SCL, SDA. That is the common SSD1306 I2C module order, but the OLED module (MPN) is not named in the review files, and some modules swap VCC/GND. Name the module and check its pin order. [PZ254V-11-04P generic 2.54 mm header (LCSC C492403)] (reviewer could not decide)"
status = "accepted"
reason = "J3 follows the common 0.96 in SSD1306 I2C module order GND-VCC-SCL-SDA, silkscreen-labelled; README bring-up says to check the bought module's order before plugging it"
source = "review"

[[finding]]
id = "review:Q1:gate-drive"
ref = "Q1"
pin = "G"
text = "The R3 100k / R7 47k divider gives only Vgs = -5 V x 100/147 = -3.4 V at the 5 V contract (pre-NVM bring-up, or a non-PD or PC source). That is barely past the -3.0 V max threshold, and Rds(on) is unspecified there, so VIN can sag under load. Change R7 to 10 kOhm (Vgs -4.5 V at 5 V, -18.2 V at 20 V) or use a P-FET rated at VGS = -4.5 V. R3 turns it off when U1 is unpowered. [AOS AO4407A datasheet (VGS(th) -1.7/-2.3/-3.0 V; RDS(on) only specified down to VGS = -6 V, 17 mOhm); ST STUSB4500 DS12499 p.8 sec. 2.2.10]"
status = "accepted"
reason = "5 V contracts are bring-up only (logic + light loads); R7 = 10k would drive Vgs to -32 V at the SMBJ22A clamp (35.5 V), beyond the AO4407A's +-25 V"
source = "review"

[[finding]]
id = "review:U11:current-budget"
ref = "U11"
pin = ""
text = "The intent runs 3.0 A, exactly the 3 A rating with no margin, and the ISET hardware range goes to 3.3 A. With 10 uH -20 % at 340 kHz and Vout ~10 V, the peak is 3 A + 0.92 A = 3.9 A, above the 3.85 A ISC min, so the part can current-limit before CC takes over. Use 15 uH (peak ~3.6 A) and cap firmware ISET at <= 2.8-3.0 A, or move to the LMR33640 (4 A). [TI LMR33630 SNVSAN3F p.6 sec. 7.3 (IOUT 3 A max), p.7 (ISC 3.85 A min), p.8 (fSW 340 kHz min)]"
status = "open"
reason = ""
source = "review"

[[finding]]
id = "review:U11:inductor"
ref = "U11"
pin = ""
text = "L_MIN at 16.6 V / 400 kHz is 11.6 uH, but L11 is 10 uH (8 uH at -20 %), so it is below TI's minimum above ~14 V out (~11 V at tolerance). That risks subharmonic oscillation at high duty. Use 15 uH (TI's 12 V / 400 kHz value) with Isat >= 5.05 A (ISC max). [TI LMR33630 SNVSAN3F p.22 Eq. 5 (L_MIN >= 0.28 x VOUT / fSW), p.21 sec. 9.2.2.4; FXL1040-100-M (JLCPCB C475915: 10 uH +-20 %, Isat 8.5 A)]"
status = "open"
reason = ""
source = "review"

[[finding]]
id = "review:U11:output-cap"
ref = "U11"
pin = ""
text = "4 x 22 uF 25 V 1206 X5R matches TI's table, but at 16 V DC bias only ~18 uF remain. The FB network keeps a feedback gain of 0.625 at every Vout (10x TI's design at 16 V), so stability rests on the R111/C113 lag network and a sim using unpublished internal compensation values. Measure the loop (Bode or 2 A step) at 1.6, 5 and 16.6 V before release. [TI LMR33630 SNVSAN3F p.20 Table 9-2 (400 kHz, 12 V: 4 x 22 uF), p.22-23 sec. 9.2.2.5] (reviewer could not decide)"
status = "accepted"
reason = "the loop is simulated with derived internal-compensation constants (sim/buck_loop.cir); measuring the loop at 1.6 / 5 / 16.6 V on the prototype is a README open item"
source = "review"

[[finding]]
id = "review:U11:output-voltage"
ref = "U11"
pin = "FB"
text = "Vout = 1.6 V + 120 kOhm x Isink, with Isink = VSET / R104. VSET maxes at 3.3 V x 10k / (10k+100k+10k) = 0.275 V, so Isink is at most 115 uA and Vout_max is about 15.2 V (14.8-15.7 V with tolerances), not the intended 16.6 V. Fix: R104/R204 2.4 kOhm -> 2.2 kOhm (Vout_max ~16.5 V), or R108/R208 10 kOhm -> 11 kOhm, plus firmware calibration. [TI LMR33630 SNVSAN3F p.7 sec. 7.5 (VFB 0.985-1.015 V)]"
status = "open"
reason = ""
source = "review"

