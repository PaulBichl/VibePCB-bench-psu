[[finding]]
id = "review:U3:inductor"
ref = "U3"
pin = "SW"
text = "L1 6.8 \u00b5H meets Lmin 3.6 \u00b5H, but its 4 A Isat is below ISC max 5.05 A and ILIMIT max 4.1 A, so a short on V5 can saturate it. Fix: use a 6.8 \u00b5H part with Isat >= 5.1 A (e.g. FXL0630/FXL0650 size). [LMR33630 SNVSAN3F p.21-22 \u00a79.2.2.4 (Isat should be >= ISC 5.05 A max; must not be < ILIMIT 4.1 A max), p.7; FXL0530-6R8-M (LCSC C177249) Isat 4 A, 3.5 A rated]"
status = "accepted"
reason = "FXL0530-6R8 is metal composite: its 4 A Isat is the -30 % inductance point, a soft roll-off, not a ferrite's hard saturation; at the 4.1 A max limit L is still ~4.7 uH > Lmin 3.6 uH. V5 is an internal rail (no connector, only the LDO and two gate pull-ups), so a short needs a board fault, and the LMR33630 hiccup mode ends it. A 5.1 A part means a larger footprint in the crowded logic block"
source = "review"

