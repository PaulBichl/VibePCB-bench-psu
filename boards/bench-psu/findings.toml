# Review findings (format: src/vibepcb/findings.py). Set status = "accepted" with a reason to close one.

[[finding]]
id = "review:D101:orientation"
ref = "D101"
pin = "1"
text = "parts.md names the LED pins only pin1/pin2. The circuit needs pin1 (to R112/V3V3) = anode and pin2 (Q12 collector) = cathode. Check that the footprint's pin 1 is the anode, since many 0603 LED footprints put the cathode on pin 1. [KT-0603YG datasheet (cathode mark)] (reviewer could not decide)"
status = "accepted"
reason = "tscircuit's <led> defines pin1 = anode, pin2 = cathode and the TSX wires .anode/.cathode by name; assembly polarity is checked in JLCPCB's DFM preview"
source = "review"

