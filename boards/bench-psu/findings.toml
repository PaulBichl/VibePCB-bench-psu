# Review findings (format: src/vibepcb/findings.py). Set status = "accepted" with a reason to close one.

[[finding]]
id = "review:D101:orientation"
ref = "D101"
pin = "pin1"
text = "The circuit needs pin1 = anode (R112 from V3V3) and pin2 = cathode (Q12 collector), but parts.md names the pads only pin1/pin2. Check that the footprint's pad 1 is the anode, not the cathode mark. [KT-0603YG datasheet not readable (LCSC C2289)] (reviewer could not decide)"
status = "accepted"
reason = "pin1 = anode is verified: tscircuit's <led> names pin1 anode, the TSX wires .anode/.cathode by name and the netlist shows D101-D202 pin1 (+); the footprint's pad 1 is at -x where the silkscreen bracket closes (marks the ANODE, noted in the README bring-up step 0 for hand assembly)"
source = "review"

