[[finding]]
id = "review:J3:pinout"
ref = "J3"
pin = ""
text = "J3 is GND, VCC, SCL, SDA for the OLED module, but no module MPN is given; common 0.96 inch SSD1306 I2C modules come in both GND-VCC and VCC-GND orders. Name the exact module and confirm its header order (a swap reverses the 3V3 supply). (reviewer could not decide)"
status = "accepted"
reason = "J3 follows the common 0.96 in SSD1306 I2C module order GND-VCC-SCL-SDA, silkscreen-labelled; README bring-up says to check the bought module's order before plugging it"
source = "review"

[[finding]]
id = "review:Q1:gate-drive"
ref = "Q1"
pin = "G"
text = "At 20 V the R3 100k / R7 47k divider gives Vgs = -13.6 V (fine). At the 5 V bring-up contract it gives only -3.4 V, just past the -3.0 V max threshold and far below the -6 V Rds(on) spec, so Q1 can sit in linear mode. Fix: change R7 to 10 k\u03a9 (Vgs -4.5 V at 5 V, -18.2 V at 20 V, inside \u00b125 V). [AO4407A Rev.11.1 p.2 (VGS(th) -1.7/-2.3/-3.0 V; RDS(on) specified only down to VGS = -6 V); STUSB4500 DS12499 p.8 (VBUS_EN_SNK asserted at 5 V by default)]"
status = "accepted"
reason = "20 V is the operating contract (the factory NVM already asks for it); a 5 V-only source runs the logic only (~0.2 A, Vgs -3.4 V is past the -3.0 V max threshold: a few 100 mOhm, mW of loss). R7 = 10k would give Vgs -32 V at the SMBJ22A clamp, beyond the AO4407A's +-25 V"
source = "review"

[[finding]]
id = "review:U11:input-cap"
ref = "U11"
pin = "VIN"
text = "U11 has C101 + C102 10 \u00b5F 50 V 1206 (about 4.5 \u00b5F each at 20 V, about 9 \u00b5F effective) and C103 100 nF, not the required 220 nF HF cap. Fix: make C103 a 220 nF 50 V X7R next to VIN/PGND; consider a third 10 \u00b5F. [LMR33630 SNVSAN3F p.23 \u00a79.2.2.6 (>= 10 \u00b5F effective ceramic plus a 220 nF 50 V X7R as close as possible to VIN)]"
status = "open"
reason = "fixed: C103 220 nF 50 V X7R (C107083); recheck in the next review"
source = "review"

[[finding]]
id = "review:U11:output-cap"
ref = "U11"
pin = "FB"
text = "FB gain is fixed at 200k/320k = 0.625 (1.6 V-like loop) at every set point, but 4 x 22 \u00b5F 25 V X5R falls to about 18 \u00b5F at 16 V. Eq.6 for a 2 A step / 400 mV at 1.6 V wants about 150 \u00b5F vs about 70 \u00b5F fitted, and stability rests on the R111/C113 lag network checked only with assumed internal compensation. Fix: add bulk (e.g. 100 \u00b5F 25 V polymer) per output so Cout stays nearly constant, and confirm phase margin on the bench. [LMR33630 SNVSAN3F p.20 Table 9-2 (4 x 22 \u00b5F validated for 3.3-12 V), p.22 Eq.6 and p.22-23 (Cout sets phase margin; Bode/transient test required)]"
status = "open"
reason = "fixed: C25 100 uF electrolytic at the terminal (no DC-bias loss, ESR damping); buck_loop phase margin >= 63 deg for ESR 0.05..1 Ohm"
source = "review"

[[finding]]
id = "review:U1:control-pins"
ref = "U1"
pin = "VBUS_EN_SNK"
text = "RESET to GND and ADDR0/ADDR1 to GND (address 0x28) are fine. But the factory NVM requests 20 V / 1.0 A (PDO3), so a 20 V charger delivers 20 V from the first plug-in, not 5 V as the intent assumes. Firmware must keep the load under 1 A (20 W) until the NVM is written, or write the NVM before first use. [STUSB4500 DS12499 Rev 3 p.22 Table 18 (default NVM: PDO2 15 V/1.5 A, PDO3 20 V/1.0 A), p.5 \u00a72.2.3 (RESET active high), p.6 \u00a72.2.4]"
status = "accepted"
reason = "no board change needed: the intent is corrected (factory NVM gives 20 V / 1 A from a 20 V source); the firmware keeps both channels off (EN low, the 100k pull-downs hold them off in reset too) until it has written the NVM, so the load stays at the logic's ~1 W"
source = "review"

