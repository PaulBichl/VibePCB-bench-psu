[[finding]]
id = "review:U3:inductor"
ref = "U3"
pin = "SW"
text = "L1 Isat 4 A is below ILIMIT max 4.1 A and ISC typ 4.5 A, so a short on V5 can saturate it (normal 0.5 A load peaks \u2248 1.2 A and is fine). Fix: a 6.8-8.2 \u00b5H part with Isat \u2265 5.1 A (e.g. FXL0630/FXL0650 class); 6.8 \u00b5H itself is fine (Eq. 5 min 3.6 \u00b5H, Table 9-2 gives 8 \u00b5H). [TI SNVSAN3F p.21-22 \u00a79.2.2.4 (Isat must not be less than ILIMIT 4.1 A max, ideally \u2265 ISC 5.05 A max); JLCPCB C177249 FXL0530-6R8-M: Isat 4 A]"
status = "accepted"
reason = "FXL0530-6R8 is metal composite: its 4 A Isat is the -30 % inductance point, a soft roll-off, not a ferrite's hard saturation; at the 4.1 A max limit L is still ~4.7 uH > Lmin 3.6 uH. V5 is an internal rail (no connector; the LDO and two gate pull-ups), so a short needs a board fault, and the LMR33630's hiccup mode ends it"
source = "review"

[[finding]]
id = "review:board:current-path"
ref = ""
pin = ""
text = "There is no fuse (the PD source limits current). J1 is listed at 3 A, equal to the full 3 A contract (see J1:current). About 130 \u00b5F (C6 100 \u00b5F + 7 \u00d7 10 \u00b5F derated) is switched onto VBUS by Q1 during PD voltage transitions; check it against the USB PD sink bulk-capacitance limit (cSnkBulkPd). [LCSC / JLCPCB C2765186 listings (3 A); AOS AO4407A p.1-2; USB PD spec sink bulk-capacitance limit not looked up] (reviewer could not decide)"
status = "accepted"
reason = "no fuse by design: the PD source limits current and the INA226 trips each channel. The bulk behind Q1 (~150 uF) is switched on slowly (C19: ~3 ms gate ramp), so the attach capacitance is only the VBUS side (C19 100 nF, TVS, ESD); at a 5 -> 20 V transition the source's slew limit sets the charge current, as for any large-bulk 60 W sink (laptops). The exact cSnkBulkPd figure was not verified (USB-IF spec)"
source = "review"

[[finding]]
id = "review:board:sims"
ref = ""
pin = ""
text = "buck_loop, cc_loop and both powerup decks rest on an assumed internal compensation (gm 1 mS, Rc 12 k\u03a9, Cc 4.7 nF, Ri 0.1 V/A) that the datasheet does not publish, so their phase-margin and step results for this fixed-gain FB network are not datasheet-backed. buck_loop also does not measure the 1 ms recovery claimed in intent. Fix: confirm by bench Bode (inject at R102/R202) and 2 A steps at 1.6 V and 16.6 V; buck_loadpoints (max RDS-ON, ISC min) is properly sourced. [TI SNVSAN3F p.22-23 \u00a79.2.2.5 (Bode plots and load transients must be validated); p.7-8 (ISC, ILIMIT, RDS-ON, tSS 2.9-6 ms)]"
status = "accepted"
reason = "the loop rests on TI's unpublished internal compensation: the decks use derived constants and show CV phase margin >= 63 deg for any ESR 0.05..1 Ohm of C25/C26 (wide margin, not a datasheet proof); the README bring-up measures the loop (injection at R102/R202, 2 A steps at 1.6 and 16.6 V) before use; the 1 ms recovery claim was dropped from the intent (bench item)"
source = "review"

