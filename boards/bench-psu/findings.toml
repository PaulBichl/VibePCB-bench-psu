[[finding]]
id = "review:U11:current-budget"
ref = "U11"
pin = ""
text = "The intent's 3 A per channel equals the 3 A rating, with no margin. With 15 uH the guaranteed average current limit is ILIMIT min + ripple/2 = 2.9 A + 0.12 A = 3.02 A at 1.6 V out, and ISET full scale (3.3 V at 1 V/A) allows 3.3 A. Fix: rate the channel and the firmware CC/INA226 ceiling at about 2.8 A. [TI SNVSAN3F p.6 7.3 (IOUT max 3 A), p.7 ILIMIT (low-side valley) 2.9 A min]"
status = "accepted"
reason = "3 A is the LMR33630's recommended-operating maximum, so running at it is inside the datasheet; the guaranteed average limit (2.9 A valley + ripple/2 = 3.02 A) still covers it. The firmware caps ISET at 3.0 A (README firmware duties) and the CC loop holds the output below the converter's own limit; buck_loadpoints: Tj 112 C at 3 A with max Rds(on)"
source = "review"

[[finding]]
id = "review:U11:output-cap"
ref = "U11"
pin = ""
text = "4 x 22 uF 25 V X5R 1206 (~18 uF effective at 16.6 V) + 100 uF electrolytic stays under the 1000 uF limit (p.23). But the fixed 1.6 V-style feedback divider is outside Table 9-2 (p.20), and stability rests only on buck_loop.cir with assumed, unpublished internal compensation. TI p.22-23 asks for measured Bode / load-step results; measure at 1.6, 5, 12 and 16.6 V. (reviewer could not decide)"
status = "accepted"
reason = "the loop rests on TI's unpublished internal compensation: the decks use derived constants and show CV phase margin >= 63 deg for any ESR 0.05..1 Ohm of C25/C26 (wide margin, not a datasheet proof); the README bring-up measures the loop (injection at R102/R202, 2 A steps at 1.6 and 16.6 V) before use"
source = "review"

[[finding]]
id = "review:U11:output-voltage"
ref = "U11"
pin = "5"
text = "The range is right: Vout = 1.0 V x (1 + 120k/200k) + 120 kOhm x VSET / 2.2 kOhm gives 1.6-16.6 V. But FB = 0.625 x (OUT1 - 120 kOhm x Isink). When the set point drops, PWM/3V3 is lost or EN goes low at light load, the buck cannot pull OUT1 down, and FB reaches 0.625 x 16.6 V = 10.4 V for up to seconds, far above the 5.5 V abs max. Fix: clamp FB with a low-leakage diode (e.g. 1N4148W) to V3V3, or add a load that discharges the output on set-point decreases. [TI SNVSAN3F p.6 sec. 7.1: FB abs max 5.5 V; p.7 VFB 0.985-1.015 V]"
status = "open"
reason = "fixed: D16 1N4148W FB1 -> V3V3 clamp; sim/powerup_ch.cir fb_max_v 3.81 V (10.30 V without)"
source = "review"

