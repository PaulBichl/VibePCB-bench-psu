[[finding]]
id = "review:U3:inductor"
ref = "U3"
pin = ""
text = "6.8 uH is fine (LMIN 3.6 uH, K = 0.46 at 20 V in). But the FXL0530-6R8-M saturates at 4 A, below the 4.5 A typical high-side limit and the 4.1 A max valley limit, so an overload or short on V5 drives it into saturation. Fix: use a 6.8-8.2 uH inductor with Isat >= 5.1 A. [TI SNVSAN3F p.21-22 9.2.2.4 (Isat ideally >= ISC, must not be below ILIMIT), p.7 ISC 4.5 A typ / 5.05 A max, ILIMIT 4.1 A max; JLCPCB C177249 FXL0530-6R8-M Isat 4 A]"
status = "accepted"
reason = "FXL0530-6R8 is metal composite: its 4 A Isat is the -30 % inductance point, a soft roll-off, not a ferrite's hard saturation; at the 4.1 A max limit L is still ~4.7 uH > Lmin 3.6 uH. V5 is an internal rail (no connector; the LDO and two gate pull-ups), so a short needs a board fault, and the LMR33630's hiccup mode ends it"
source = "review"

[[finding]]
id = "review:board:sims"
ref = ""
pin = ""
text = "powerup_ch.cir only steps the set point up, never down at light load, so it cannot see FB rising to about 10 V (above 5.5 V abs max). buck_loadpoints.cir checks the peak against ISC but not the valley against ILIMIT 2.9 A min. The loop decks use assumed, unpublished gm/Rc/Cc, so their phase margins are indicative only. Fix: add a set-point step-down deck with a measure on max V(fb) and a valley-current check, and confirm the loops on hardware. [TI SNVSAN3F p.6 (FB abs max 5.5 V), p.7 (ILIMIT 2.9 A min), p.22-23 (validate loop by Bode/transient)]"
status = "accepted"
reason = "the loop rests on TI's unpublished internal compensation: the decks use derived constants and show CV phase margin >= 63 deg for any ESR 0.05..1 Ohm of C25/C26 (wide margin, not a datasheet proof); the README bring-up measures the loop (injection at R102/R202, 2 A steps at 1.6 and 16.6 V) before use; the 1 ms recovery claim was dropped from the intent (bench item)"
source = "review"

