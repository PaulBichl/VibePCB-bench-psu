[[finding]]
id = "review:Q1:gate-drive"
ref = "Q1"
pin = "G"
text = "R3 100 k\u03a9 / R7 47 k\u03a9 give VGS = -(VBUS - 0.4 V) \u00d7 0.68 \u2248 -3.1 V at the 5 V attach (every power-up, and on 5 V-only sources), right at VGS(th) max -3 V, so the logic supply may not come up on a high-threshold part. At 20 V it is -13.6 V (fine). Fix: R7 = 10 k\u03a9 (VGS -4.0 V at 5 V and -19 V at 21 V, inside \u00b125 V), or a PMOS with RDS(ON) specified at -2.5 V. [AOS AO4407A Rev 11.1 p.2 (VGS(th) -1.7/-2.3/-3.0 V; RDS(ON) only specified down to VGS -6 V), p.3 Fig. 1; ST DS12499 p.28 (VBUS_EN_SNK VOL 0.4 V)]"
status = "accepted"
reason = "PD always attaches at 5 V, then the firmware-written NVM (or the factory PDO3) moves to 20 V within ~0.5 s, where Vgs = -13.6 V; at the 5 V attach Q1 may conduct only weakly (Vgs -3.1 V vs Vth max -3.0 V), which at most delays the logic start until 20 V. 5 V-only sources are not supported (intent). R7 = 10k would put Vgs at -32 V at the SMBJ22A clamp, beyond the AO4407A's +-25 V"
source = "review"

[[finding]]
id = "review:U11:output-cap"
ref = "U11"
pin = "FB"
text = "4 \u00d7 22 \u00b5F 25 V 1206 (\u2248 18 \u00b5F at 16.6 V) + C25 100 \u00b5F electrolytic after the shunt, with a fixed FB gain of 0.625 and an R111/C113 lag network: stability cannot be judged from the datasheet (internal compensation is not published) and relies on the assumed-compensation sims. Bench Bode at 1.6 V and 16.6 V is needed. [TI SNVSAN3F p.20 Table 9-2 (12 V/400 kHz: 4 \u00d7 22 \u00b5F), p.22-23 \u00a79.2.2.5 (Bode / transient validation required)] (reviewer could not decide)"
status = "accepted"
reason = "the loop rests on TI's unpublished internal compensation: the decks use derived constants and show CV phase margin >= 63 deg for any ESR 0.05..1 Ohm of C25/C26 (wide margin, not a datasheet proof); the README bring-up measures the loop (injection at R102/R202, 2 A steps at 1.6 and 16.6 V) before use"
source = "review"

