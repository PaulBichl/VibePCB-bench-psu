[[finding]]
id = "review:U3:inductor"
ref = "U3"
pin = "8"
text = "L1 FXL0530-6R8-M saturates at 4 A. That is below the LMR33630's high-side current limit (up to 5.05 A) and below the maximum low-side limit of 4.1 A, so a short on V5 can saturate the inductor. Ripple is 1.38 A, 46 % of 3 A. Fix: use a 6.8-8.2 \u00b5H part with Isat \u2265 5.1 A (TI's table uses 8 \u00b5H for 5 V at 400 kHz). [LMR33630 SNVSAN3F p.21-22 sec. 9.2.2.4 (Isat ideally \u2265 ISC, never below ILIMIT); p.7 Table 7.5 (ISC 3.85-5.05 A, ILIMIT max 4.1 A); FXL0530-6R8-M (JLCPCB C177249: Isat 4 A, Irms 3.5 A)]"
status = "accepted"
reason = "FXL0530-6R8 is metal composite: its 4 A Isat is the -30 % inductance point, a soft roll-off, not a ferrite's hard saturation; at the 4.1 A max limit L is still ~4.7 uH > Lmin 3.6 uH. V5 is an internal rail (no connector; the LDO and two gate pull-ups), so a short needs a board fault, and the LMR33630's hiccup mode ends it"
source = "review"

[[finding]]
id = "review:U5:ground"
ref = "U5"
pin = ""
text = "parts.md lists GND pins 1, 2, 42, 43 and 46-61 only; the four corner GND pads 62-65 are missing from the footprint. Add pads 62-65 per the land pattern (p.45 Fig. 11-1) and tie them to GND for ground return and mechanical anchoring. (cites pin 62, which U5 does not have) [ESP32-S3-MINI-1 datasheet v1.7 p.10 Fig. 3-1, p.11 Table 3-1 (GND = pins 1, 2, 42, 43, 46-65)]"
status = "accepted"
reason = "the corner GND pads are there: the footprint names them 61 like the 9 centre pads (13 pads '61': four 0.8 mm corner pads at the module corners + 3 x 3 centre pads, all GND), so the pin numbers 62-65 don't appear in parts.md"
source = "review"

[[finding]]
id = "review:board:intent"
ref = ""
pin = ""
text = "Rails match the intent (V5 5.17 V, V3V3 3.3 V, OUTn 1.6-16.6 V), but the CC claim fails into a hard short. The intent itself says the buck runs at its own 4.5 A limit for about 2 ms before the CC loop takes over. With FB = 0.625 x VOUT, any VOUT below about 0.64 V (e.g. a 0.05 \u03a9 short) puts FB under 0.4 V and the LMR33630 hiccups instead of regulating Iset. Fix: test a hard short on the prototype; if it hiccups, make the CC loop engage faster (pre-bias U7's output to just below D14 conduction) or accept and document hiccup-mode short-circuit behaviour. [LMR33630 SNVSAN3F p.15 sec. 8.3.3 (FB < 0.4 V during current limit enters hiccup: 94 ms off, then soft-start restart); p.9 VHC 0.4 V]"
status = "accepted"
reason = "intent corrected: into a hard short the LMR33630 may hiccup (FB < 0.4 V while at its own current limit) for the ~2 ms before the CC loop takes over; the current stays limited either way (hiccup is a protection mode, the INA226 trip the backstop). README bring-up 4.4 tests CC into a short at 1 A and 3 A on the prototype"
source = "review"

[[finding]]
id = "review:board:sims"
ref = ""
pin = ""
text = "buck_loop, cc_loop and powerup_ch rest on assumed internal compensation (gm 1 mS, Rc 12 k\u03a9, Cc 4.7 nF, Ri 0.1 V/A, which the decks admit are unpublished), so their phase-margin results are not proof. None of the averaged models includes the VFB < 0.4 V hiccup, and cc_loop's transient only tests 20 \u03a9 to 2 \u03a9, never a short, though it reports AC margins at 0.05 \u03a9. Fix: add a hiccup comparator (current limit and FB < 0.4 V) and a hard-short transient to cc_loop, and confirm loop stability with a Bode measurement on hardware. [LMR33630 SNVSAN3F p.15 sec. 8.3.3 (hiccup at VFB < 0.4 V in current limit); p.22-23 sec. 9.2.2.5 (Bode/transient testing required)]"
status = "accepted"
reason = "the loop rests on TI's unpublished internal compensation: the decks use derived constants and show CV phase margin >= 63 deg for any ESR 0.05..1 Ohm of C25/C26 (wide margin, not a datasheet proof); the README bring-up measures the loop (injection at R102/R202, 2 A steps at 1.6 and 16.6 V) before use; the 1 ms recovery claim was dropped from the intent (bench item)"
source = "review"

[[finding]]
id = "fb_divider:U11"
ref = "U11"
pin = "FB"
text = "divider R102 120000 / R103 200000 ohm to OUT1 (16.6 V) implies Vref 10.375 V, outside the usual 0.4..1.3 V (set vref in intent.toml to check it)"
status = "accepted"
reason = "the divider alone gives 1.6 V (Vref 1.0 V); the output above that is set by the VSET current sink (Q11/Q21 + U6) pulling Ic from FB: Vout = 1.6 V + 120k * Ic, verified in sim/powerup_ch.cir and buck_loop.cir"
source = "netcheck"

